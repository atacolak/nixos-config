general {
    disable_loading_bar = true
    hide_cursor = true
}

background {
    path = /home/sf/.config/hypr/wallpaper.jpg
    blur_passes = 2
    blur_size = 4
}

input-field {
    size = 260, 48
    position = 0, -40
    halign = center
    valign = center
    outline_thickness = 1
    dots_center = true
    fade_on_empty = false
    font_color = rgba(e6e6e6ff)
    inner_color = rgba(0b0f14cc)
    outer_color = rgba(77ff77aa)
    check_color = rgba(d6ff8aff)
    fail_color = rgba(ff7777ff)
}
