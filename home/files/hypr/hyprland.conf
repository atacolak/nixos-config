# hyprland config managed by home manager.
# preference port from the ubuntu/i3 desktop, translated to wayland/hyprland.

monitor=,preferred,auto,1

$mod = SUPER
$terminal = kitty-shade
$menu = fuzzel
$fileManager = nautilus
$browser = firefox
$editor = code

# autostart
exec-once = waybar
exec-once = mako
exec-once = nm-applet --indicator
exec-once = blueman-applet
exec-once = hyprpaper
exec-once = hypridle

# environment
env = XCURSOR_SIZE,24
env = HYPRCURSOR_SIZE,24
env = NIXOS_OZONE_WL,1

input {
    kb_layout = au
    follow_mouse = 1
    mouse_refocus = false

    touchpad {
        natural_scroll = true
        tap-to-click = true
    }
}

cursor {
    no_warps = true
}

general {
    gaps_in = 4
    gaps_out = 8
    border_size = 2
    layout = dwindle
    col.active_border = rgba(6fa8bacc)
    col.inactive_border = rgba(22334499)
}

decoration {
    rounding = 8
    active_opacity = 1.0
    inactive_opacity = 0.96

    shadow {
        enabled = true
        range = 8
        render_power = 3
        color = rgba(00000066)
    }

    blur {
        enabled = true
        size = 4
        passes = 2
        vibrancy = 0.16
    }
}

animations {
    enabled = true
    bezier = smoothOut, 0.23, 1, 0.32, 1
    bezier = smoothIn, 0.65, 0.05, 0.36, 1
    animation = windows, 1, 4, smoothOut, popin 87%
    animation = windowsOut, 1, 3, smoothIn, popin 87%
    animation = border, 1, 5, smoothOut
    animation = fade, 1, 4, smoothOut
    animation = workspaces, 1, 4, smoothOut
}

dwindle {
    preserve_split = true
}

group {
    col.border_active = rgba(6fa8bacc)
    col.border_inactive = rgba(22334499)

    groupbar {
        col.active = rgba(6fa8bacc)
        col.inactive = rgba(22334499)
        text_color = rgba(ddeeffee)
        text_color_inactive = rgba(aabbcccc)
    }
}

misc {
    disable_hyprland_logo = true
    disable_splash_rendering = true
    focus_on_activate = true
}

# terminal / launcher / apps
bind = $mod, RETURN, exec, $terminal
bind = $mod SHIFT, Z, exec, task-terminal main
bind = $mod, SPACE, exec, $menu
bind = $mod, Q, exec, hypr-kill-active
bind = $mod SHIFT, Q, forcekillactive
bind = $mod, F, exec, hypr-cycle-or-run --class 'firefox|firefox-devedition|firefox-dev' --scope current --launch $browser
bind = $mod, C, exec, hypr-cycle-or-run --class 'code|Code' --scope current --launch $editor
bind = $mod, T, exec, hypr-cycle-or-run --class 'kitty' --scope current --launch $terminal
bind = $mod, D, exec, hypr-cycle-or-run --class 'org.gnome.Nautilus|nautilus|thunar' --scope current --launch $fileManager
bind = $mod CTRL, F, fullscreen
bind = $mod, A, togglefloating
bind = $mod SHIFT, A, centerwindow
bindm = $mod, mouse:272, movewindow
bindm = $mod, mouse:273, resizewindow
bind = $mod, G, layoutmsg, togglesplit
bind = $mod, W, exec, hypr-group-start
bind = $mod, S, exec, hypr-group-toggle
bind = $mod, E, changegroupactive, f
bind = $mod SHIFT, E, changegroupactive, b
bind = $mod SHIFT, R, exec, hyprctl reload

# focus and movement: vim muscle memory plus arrow fallback
bind = $mod, H, movefocus, l
bind = $mod, J, movefocus, d
bind = $mod, K, movefocus, u
bind = $mod, L, movefocus, r
bind = $mod, left, movefocus, l
bind = $mod, down, movefocus, d
bind = $mod, up, movefocus, u
bind = $mod, right, movefocus, r

bind = $mod SHIFT, H, movewindow, l
bind = $mod SHIFT, J, movewindow, d
bind = $mod SHIFT, K, movewindow, u
bind = $mod SHIFT, L, movewindow, r
bind = $mod SHIFT, left, movewindow, l
bind = $mod SHIFT, down, movewindow, d
bind = $mod SHIFT, up, movewindow, u
bind = $mod SHIFT, right, movewindow, r

# window cycling
bind = $mod, TAB, cyclenext
bind = $mod SHIFT, TAB, cyclenext, prev
bind = ALT, TAB, cyclenext
bind = ALT SHIFT, TAB, cyclenext, prev

# resizing. super+r enters i3-like resize mode; super+ctrl+hjkl is immediate resize.
bind = $mod, R, submap, resize
binde = $mod CTRL, H, resizeactive, -40 0
binde = $mod CTRL, J, resizeactive, 0 40
binde = $mod CTRL, K, resizeactive, 0 -40
binde = $mod CTRL, L, resizeactive, 40 0
binde = $mod CTRL, left, resizeactive, -80 0
binde = $mod CTRL, down, resizeactive, 0 80
binde = $mod CTRL, up, resizeactive, 0 -80
binde = $mod CTRL, right, resizeactive, 80 0

submap = resize
binde = , H, resizeactive, -10 0
binde = , L, resizeactive, 10 0
binde = , J, resizeactive, 0 10
binde = , K, resizeactive, 0 -10
binde = SHIFT, H, resizeactive, -40 0
binde = SHIFT, L, resizeactive, 40 0
binde = SHIFT, J, resizeactive, 0 40
binde = SHIFT, K, resizeactive, 0 -40
bind = , ESCAPE, submap, reset
bind = , RETURN, submap, reset
submap = reset

# workspaces
bind = $mod, 1, workspace, 1
bind = $mod, 2, workspace, 2
bind = $mod, 3, workspace, 3
bind = $mod, 4, workspace, 4
bind = $mod, 5, workspace, 5
bind = $mod, 6, workspace, 6
bind = $mod, 7, workspace, 7
bind = $mod, 8, workspace, 8
bind = $mod, 9, workspace, 9
bind = $mod, 0, workspace, 10

bind = $mod SHIFT, 1, movetoworkspace, 1
bind = $mod SHIFT, 2, movetoworkspace, 2
bind = $mod SHIFT, 3, movetoworkspace, 3
bind = $mod SHIFT, 4, movetoworkspace, 4
bind = $mod SHIFT, 5, movetoworkspace, 5
bind = $mod SHIFT, 6, movetoworkspace, 6
bind = $mod SHIFT, 7, movetoworkspace, 7
bind = $mod SHIFT, 8, movetoworkspace, 8
bind = $mod SHIFT, 9, movetoworkspace, 9
bind = $mod SHIFT, 0, movetoworkspace, 10

# screenshots
bind = $mod SHIFT, S, exec, sh -lc 'grim -g "$(slurp)" - | wl-copy'
bind = $mod SHIFT ALT, S, exec, sh -lc 'mkdir -p "$HOME/Pictures/Screenshots" && grim -g "$(slurp)" "$HOME/Pictures/Screenshots/screenshot-$(date +%Y%m%d-%H%M%S).png"'

# lock
bind = $mod, semicolon, exec, hyprlock

# laptop fn row. these bind the media key symbols emitted by fn+f-keys:
# fn+f1 output mute, fn+f2 volume down, fn+f3 volume up,
# fn+f4 brightness down, fn+f5 brightness up, fn+f6 touchpad toggle,
# fn+f9 mic mute.
bindl = , XF86AudioMute, exec, wpctl set-mute @DEFAULT_AUDIO_SINK@ toggle
bindel = , XF86AudioLowerVolume, exec, wpctl set-volume @DEFAULT_AUDIO_SINK@ 5%-
bindel = , XF86AudioRaiseVolume, exec, wpctl set-volume -l 1.0 @DEFAULT_AUDIO_SINK@ 5%+
bindel = , XF86MonBrightnessDown, exec, brightnessctl set 5%-
bindel = , XF86MonBrightnessUp, exec, brightnessctl set 5%+
bindl = , XF86TouchpadToggle, exec, touchpad-toggle
bindl = , XF86AudioMicMute, exec, wpctl set-mute @DEFAULT_AUDIO_SOURCE@ toggle

# media transport keys, if the keyboard emits them.
bind = , XF86AudioPrev, exec, playerctl previous
bind = , XF86AudioPlay, exec, playerctl play-pause
bind = , XF86AudioNext, exec, playerctl next

# explicit super chords for helpers that do not have dedicated laptop media keys.
bind = $mod, F5, exec, audio-input-toggle
bind = $mod, F6, exec, audio-toggle
bind = $mod, F10, exec, pavucontrol

# tree-ish transient mode: local spawning / shaping with explicit split intent.
# plain app keys preselect right; shift app keys preselect down. spawn then return to normal.
bind = $mod, Y, submap, tree
submap = tree
bind = , H, movefocus, l
bind = , J, movefocus, d
bind = , K, movefocus, u
bind = , L, movefocus, r
bind = , G, layoutmsg, togglesplit
bind = , W, exec, hypr-group-start
bind = , S, exec, hypr-group-toggle
bind = , E, changegroupactive, f
bind = SHIFT, E, changegroupactive, b
bind = , A, togglefloating
bind = , T, exec, hyprctl --batch 'dispatch layoutmsg preselect r; dispatch exec $terminal; dispatch submap reset'
bind = , F, exec, hyprctl --batch 'dispatch layoutmsg preselect r; dispatch exec $browser; dispatch submap reset'
bind = , C, exec, hyprctl --batch 'dispatch layoutmsg preselect r; dispatch exec $editor; dispatch submap reset'
bind = , D, exec, hyprctl --batch 'dispatch layoutmsg preselect r; dispatch exec $fileManager; dispatch submap reset'
bind = SHIFT, T, exec, hyprctl --batch 'dispatch layoutmsg preselect d; dispatch exec $terminal; dispatch submap reset'
bind = SHIFT, F, exec, hyprctl --batch 'dispatch layoutmsg preselect d; dispatch exec $browser; dispatch submap reset'
bind = SHIFT, C, exec, hyprctl --batch 'dispatch layoutmsg preselect d; dispatch exec $editor; dispatch submap reset'
bind = SHIFT, D, exec, hyprctl --batch 'dispatch layoutmsg preselect d; dispatch exec $fileManager; dispatch submap reset'
bind = , ESCAPE, submap, reset
bind = , RETURN, submap, reset
submap = reset

# float external viewers / transient utilities
windowrule = float 1, match:class ^(org\.pwmt\.zathura|Zathura|mpv|imv|feh|org\.gnome\.Loupe|org\.gnome\.Evince|flameshot)$
windowrule = center 1, match:class ^(org\.pwmt\.zathura|Zathura|mpv|imv|feh|org\.gnome\.Loupe|org\.gnome\.Evince|flameshot)$
