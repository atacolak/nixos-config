# minimal i3status-rust bar for i3bar/swaybar
icons_format = ""

[theme]
theme = "plain"

[[block]]
block = "net"
format = " net $ip dn $speed_down.eng(prefix:K) up $speed_up.eng(prefix:K) "
format_alt = " net $device {$ssid |}$ip "
missing_format = " net x "
inactive_format = " net down "
interval = 2

[[block]]
block = "disk_space"
path = "/"
info_type = "available"
alert_unit = "GB"
warning = 20.0
alert = 10.0
format = " disk / $available.eng(w:4,p:Gi) free "
format_alt = " disk / $used.eng(w:4,p:Gi)/$total.eng(w:4,p:Gi) "
interval = 20

[[block]]
block = "load"
format = " load $1m.eng(w:4) "
interval = 3

[[block]]
block = "memory"
format = " mem $mem_used.eng(w:3,p:Gi) used, $mem_avail.eng(w:3,p:Gi) avail "
format_alt = " mem $mem_used_percents.eng(w:2) used "
interval = 5

[[block]]
block = "time"
interval = 5
format = " $timestamp.datetime(f:'%Y-%m-%d %H:%M:%S') "
